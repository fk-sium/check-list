<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Add Student</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-4">

<h2>Add Student</h2>

<form id="studentForm">

<div class="row">

<div class="col-md-6 mb-3">
<label>Student Name</label>
<input type="text" id="studentName" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Guardian Mobile</label>
<input type="text" id="guardianMobile" class="form-control" required>
</div>

<div class="col-md-6 mb-3">
<label>Class</label>
<select id="studentClass" class="form-control" required>
<option value="">Select</option>
<option value="07">Class 7</option>
<option value="08">Class 8</option>
<option value="09">Class 9</option>
<option value="10">Class 10</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Group</label>
<select id="group" class="form-control">
<option value="">N/A</option>
<option>Science</option>
<option>Business Studies</option>
<option>Humanities</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Shift</label>
<select id="shift" class="form-control">
<option>Morning</option>
<option>Day</option>
</select>
</div>

<div class="col-md-6 mb-3">
<label>Monthly Fee</label>
<input type="number" id="monthlyFee" class="form-control" required>
</div>

</div>

<button class="btn btn-primary">
Save Student
</button>

</form>

</div>

<script src="js/students.js"></script>

</body>
</html>
