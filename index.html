<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTrack Ultimate v11</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f0f2f5; --surface: #ffffff; --surface-glass: rgba(255, 255, 255, 0.85);
            --text: #111827; --text-sub: #6b7280; --border: #e5e7eb;
            --primary: #4f46e5; --accent: #f59e0b; --success: #10b981; --danger: #ef4444;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --heat-0: #e5e7eb; --heat-1: #c7d2fe; --heat-2: #818cf8; --heat-3: #6366f1; --heat-4: #312e81;
        }
        [data-theme="dark"] {
            --bg: #0f172a; --surface: #1e293b; --surface-glass: rgba(30, 41, 59, 0.85);
            --text: #f1f5f9; --text-sub: #94a3b8; --border: #334155; --primary: #818cf8; --accent: #fbbf24;
            --heat-0: #1e293b; --heat-1: #1e3a8a; --heat-2: #3730a3; --heat-3: #6366f1; --heat-4: #818cf8;
        }

        * { box-sizing: border-box; outline: none; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding-top: 110px; padding-bottom: 80px; transition: 0.3s; }

        /* HEADER */
        .header-container {
            position: fixed; top: 0; left: 0; right: 0; background: var(--surface-glass);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border); z-index: 1000; padding: 15px 20px;
        }
        .header-inner { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        h1 { margin: 0; font-size: 1.4rem; font-weight: 900; background: linear-gradient(135deg, var(--primary), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .rank-badge { font-size: 0.7rem; vertical-align: middle; border: 1px solid var(--border); padding: 3px 8px; border-radius: 12px; color: var(--text); text-transform: uppercase; letter-spacing: 0.5px; }

        /* DASHBOARD */
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        .dashboard-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; margin-bottom: 30px; margin-top: 10px; }
        .card { background: var(--surface); border-radius: 12px; padding: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--border); }
        
        /* Heatmap */
        .heatmap-grid { display: flex; gap: 4px; margin-top: 15px; height: 25px; align-items: flex-end; }
        .heat-cell { flex: 1; border-radius: 3px; background: var(--heat-0); height: 100%; transition: 0.3s; position: relative; }
        .heat-cell:hover::after { content: attr(data-tooltip); position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; white-space: nowrap; }

        .focus-input { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 1rem; transition: 0.3s; }
        .focus-input:focus { border-color: var(--primary); }

        /* Timer */
        .timer-display { font-size: 2.5rem; font-weight: 900; text-align: center; color: var(--text); margin: 10px 0; font-variant-numeric: tabular-nums; }
        .timer-controls { display: flex; justify-content: center; gap: 8px; }

        /* LIST STYLES */
        .section-card { background: var(--surface); border-radius: 12px; margin-bottom: 20px; box-shadow: var(--shadow-md); border: 1px solid var(--border); overflow: hidden; animation: slideUp 0.4s ease; }
        .section-header { padding: 15px 20px; background: linear-gradient(to right, var(--surface), var(--bg)); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
        .section-title { font-size: 1.1rem; font-weight: 800; color: var(--primary); }
        
        .section-stats { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--text-sub); margin-top: 5px; }
        .mini-progress-track { flex: 1; height: 6px; background: var(--border); margin: 0 15px; border-radius: 4px; overflow: hidden; }
        .mini-progress-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s; }

        .subsection-block { padding: 0 20px; margin-bottom: 10px; border-bottom: 1px dashed var(--border); padding-bottom: 10px; }
        .subsection-header { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
        .subsection-title { font-weight: 700; font-size: 0.9rem; text-transform: uppercase; color: var(--text); }

        .task-item { background: var(--bg); border-radius: 8px; padding: 10px; margin-bottom: 6px; border: 1px solid transparent; transition: 0.2s; }
        .task-item:hover { border-color: var(--primary); background: var(--surface); }
        .task-main-row { display: flex; align-items: flex-start; gap: 10px; }
        
        .subtask-container { margin-left: 28px; margin-top: 5px; border-left: 2px solid var(--border); padding-left: 10px; }
        .subtask-item { display: flex; align-items: center; gap: 8px; padding: 3px 0; font-size: 0.85rem; }

        /* Controls */
        .btn { border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.8rem; transition: 0.2s; }
        .btn:hover { transform: translateY(-1px); }
        .btn-primary { background: var(--primary); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-undo { background: var(--text); color: var(--bg); }
        .tool-btn { cursor: pointer; background: none; border: none; color: var(--text-sub); padding: 0 4px; font-size: 0.8rem; }
        .tool-btn:hover { color: var(--primary); }
        
        .checkbox { min-width: 18px; height: 18px; border: 2px solid var(--border); border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: var(--surface); margin-top: 2px; }
        .checkbox.checked { background: var(--success); border-color: var(--success); }
        .checkbox.checked::after { content: '✔'; color: white; font-size: 10px; }
        
        .date-picker { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-size: 0.85rem; cursor: pointer; font-family: inherit; }
        .notes-box { width: 100%; background: var(--text); color: var(--bg); padding: 8px; border-radius: 6px; margin-top: 5px; display: none; font-family: monospace; font-size: 0.85rem; }
        .completed .text-content { text-decoration: line-through; opacity: 0.6; }
        
        /* Utils */
        .progress-track { width: 100%; height: 4px; background: var(--border); margin-top: 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent)); width: 0%; transition: width 0.5s; }
        #confetti-canvas { position: fixed; top: 0; left: 0; pointer-events: none; z-index: 9999; }
        #toast { position: fixed; bottom: 20px; right: 20px; background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 8px; display: none; z-index: 2000; }
        .quote-area { text-align: center; font-style: italic; color: var(--text-sub); font-size: 0.9rem; margin: 40px 0; opacity: 0.8; }
        @keyframes slideUp { from { transform: translateY(10px); opacity: 0; } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 700px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>
    <div id="toast">Saved!</div>

    <div class="header-container">
        <div class="header-inner">
            <h1>DevTrack <span class="rank-badge" id="rank-badge">Novice</span></h1>
            <div style="display:flex; gap:8px; align-items:center;">
                <button class="btn btn-undo" onclick="undoAction()" id="undo-btn" style="opacity:0.5; pointer-events:none;">↩ Undo</button>
                <button class="btn btn-outline" onclick="toggleTheme()">◑</button>
                <button class="btn btn-outline" onclick="exportData()">💾</button>
                <label class="btn btn-outline" style="cursor:pointer">📂 <input type="file" style="display:none" onchange="importData(this)"></label>
            </div>
        </div>
        <div class="progress-track"><div class="progress-fill" id="global-progress"></div></div>
    </div>

    <div class="container">
        <div class="dashboard-grid">
            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-weight:bold; color:var(--text-sub); font-size:0.85rem;">🎯 GOAL FOR:</span>
                        <input type="date" id="daily-date" class="date-picker" onchange="updateDailyDate(this.value)">
                    </div>
                    <span id="streak-display" style="color:var(--accent); font-weight:bold; font-size:0.85rem;">🔥 0 Days</span>
                </div>
                <input type="text" id="daily-goal" class="focus-input" placeholder="Type your goal for this date..." oninput="saveDaily()">
                <div class="heatmap-grid" id="heatmap"></div>
            </div>
            
            <div class="card" style="text-align:center; display:flex; flex-direction:column; justify-content:center;">
                <div style="font-weight:bold; color:var(--text-sub); font-size:0.85rem;">POMODORO</div>
                <div class="timer-display" id="timer-display">25:00</div>
                <div class="timer-controls">
                    <button class="btn btn-primary" onclick="startTimer()">▶</button>
                    <button class="btn btn-outline" onclick="pauseTimer()">⏸</button>
                    <button class="btn btn-outline" onclick="resetTimer()">↺</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container" id="app"></div>

    <div class="container quote-area" id="quote-display"></div>

    <div class="container" style="text-align: center; margin-bottom: 60px;">
        <button class="btn btn-primary" style="padding: 12px 24px; font-size: 1rem;" onclick="addSection()">+ Add New Section</button>
        <br><br>
        <button class="btn btn-outline" style="color:var(--danger); border-color:var(--danger);" onclick="resetAll()">⚠️ Hard Reset</button>
    </div>

    <script>
        // --- DATA & STATE ---
        const initialData = [{ id: 1, title: "Full Stack Roadmap", startDate: "", collapsed: false, subsections: [{ id: 101, title: "Frontend", tasks: [{ id: 1001, text: "HTML Basics", completed: false, notes: "", subtasks: [{ id: 10001, text: "Tags & Attributes", completed: false }] }] }] }];
        const quotes = ["Code is like humor. When you have to explain it, it’s bad.", "Fix the cause, not the symptom.", "Make it work, make it right, make it fast.", "Simplicity is the soul of efficiency.", "Experience is the name everyone gives to their mistakes."];
        
        let data = JSON.parse(localStorage.getItem('dt_v11_data')) || initialData;
        // Daily object now stores 'date' as the currently selected date for the goal
        let daily = JSON.parse(localStorage.getItem('dt_v11_daily')) || { goal: "", date: "", streak: 0, lastVisit: "" };
        let historyStack = [];
        let darkMode = localStorage.getItem('dt_v11_theme') === 'dark';

        // --- CORE FUNCTIONS ---
        const save = () => { localStorage.setItem('dt_v11_data', JSON.stringify(data)); render(); };
        const saveState = () => { if(historyStack.length>20) historyStack.shift(); historyStack.push(JSON.parse(JSON.stringify(data))); updateUndo(); };
        const undoAction = () => { if(historyStack.length===0)return; data=historyStack.pop(); save(); updateUndo(); showToast("Undone"); };
        const updateUndo = () => { const b=document.getElementById('undo-btn'); b.style.opacity=historyStack.length>0?'1':'0.5'; b.style.pointerEvents=historyStack.length>0?'auto':'none'; };
        const linkify = (t) => t.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" style="color:var(--primary);text-decoration:underline;">link</a>');
        const showToast = (m) => { const t=document.getElementById('toast'); t.innerText=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2000); };

        // --- RENDER ENGINE ---
        function render() {
            const app = document.getElementById('app'); app.innerHTML = '';
            let globalTotal = 0, globalDone = 0;
            const heatmapCounts = {};

            data.forEach((sec, sI) => {
                let secTotal = 0, secDone = 0;
                const countItem = (item, isGlobal) => {
                    if(isGlobal) { globalTotal++; if(item.completed) globalDone++; }
                    secTotal++; if(item.completed) secDone++;
                    if(item.completed && item.completedDate) {
                        const d = new Date(item.completedDate).toDateString();
                        heatmapCounts[d] = (heatmapCounts[d]||0)+1; 
                    }
                };

                // Calc Stats
                sec.subsections.forEach(sub => {
                    sub.tasks.forEach(task => {
                        countItem(task, true);
                        if(task.subtasks) task.subtasks.forEach(st => countItem(st, true));
                    });
                });
                const secPct = secTotal === 0 ? 0 : Math.round((secDone/secTotal)*100);

                // Build HTML
                const secDiv = document.createElement('div'); secDiv.className = 'section-card';
                secDiv.innerHTML = `
                    <div class="section-header">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <div style="display:flex; gap:10px; align-items:center; cursor:pointer;" onclick="toggleCollapse(${sI})">
                                <span>${sec.collapsed?'▶':'▼'}</span> <span class="section-title">${sec.title}</span> <button class="tool-btn" onclick="event.stopPropagation(); editSection(${sI})">✏️</button>
                            </div>
                            <button class="tool-btn" style="color:var(--danger)" onclick="deleteSection(${sI})">🗑️</button>
                        </div>
                        <div class="section-stats">
                            <span>📅 Start: <input type="date" class="date-picker" value="${sec.startDate||''}" onchange="updateSectionDate(${sI},this.value)"></span>
                            <div class="mini-progress-track"><div class="mini-progress-fill" style="width:${secPct}%"></div></div>
                            <span style="font-weight:bold; color:var(--primary);">${secPct}% Done</span>
                        </div>
                    </div>`;
                
                if(!sec.collapsed) {
                    const content = document.createElement('div'); content.style.padding="10px 0";
                    sec.subsections.forEach((sub, subI) => {
                        const subDiv = document.createElement('div'); subDiv.className='subsection-block';
                        subDiv.innerHTML = `<div class="subsection-header">
                            <div><span class="subsection-title">${sub.title}</span> <button class="tool-btn" onclick="editSub(${sI},${subI})">✏️</button> <button class="tool-btn" style="color:var(--danger)" onclick="deleteSub(${sI},${subI})">🗑️</button></div>
                            <button class="btn btn-outline" style="padding:2px 8px; font-size:0.7rem;" onclick="addTask(${sI},${subI})">+ Task</button>
                        </div>`;
                        
                        sub.tasks.forEach((task, tI) => {
                            const taskDiv = document.createElement('div'); taskDiv.className = `task-item ${task.completed?'completed':''}`;
                            let html = `<div class="task-main-row">
                                <div class="checkbox ${task.completed?'checked':''}" onclick="toggleTask(${sI},${subI},${tI})"></div>
                                <div style="flex:1">
                                    <div class="text-content" style="font-weight:500;">${linkify(task.text)}</div>
                                    <div style="font-size:0.75rem; margin-top:4px; display:flex; gap:8px;">
                                        <button class="tool-btn" onclick="addSubTask(${sI},${subI},${tI})">+ Sub-task</button>
                                        <button class="tool-btn" onclick="toggleNote(${sI},${subI},${tI})">📝 Notes</button>
                                        <button class="tool-btn" onclick="editTask(${sI},${subI},${tI})">✏️</button>
                                        <button class="tool-btn" style="color:var(--danger)" onclick="deleteTask(${sI},${subI},${tI})">🗑️</button>
                                    </div>
                                    <textarea id="note-${sI}-${subI}-${tI}" class="notes-box" oninput="saveNote(${sI},${subI},${tI},this.value)">${task.notes||''}</textarea>
                                </div>
                            </div>`;
                            
                            if(task.subtasks && task.subtasks.length > 0) {
                                html += `<div class="subtask-container">`;
                                task.subtasks.forEach((st, stI) => {
                                    html += `<div class="subtask-item ${st.completed?'completed':''}">
                                        <div class="checkbox ${st.completed?'checked':''}" style="min-width:14px; height:14px;" onclick="toggleSubTask(${sI},${subI},${tI},${stI})"></div>
                                        <span class="text-content">${linkify(st.text)}</span>
                                        <button class="tool-btn" onclick="editSubTask(${sI},${subI},${tI},${stI})">✏️</button>
                                        <button class="tool-btn" style="color:var(--danger)" onclick="deleteSubTask(${sI},${subI},${tI},${stI})">×</button>
                                    </div>`;
                                });
                                html += `</div>`;
                            }
                            taskDiv.innerHTML = html; subDiv.appendChild(taskDiv);
                        });
                        content.appendChild(subDiv);
                    });
                    content.innerHTML += `<div style="text-align:center; padding:10px;"><button class="btn btn-outline" onclick="addSub(${sI})">+ Add Sub-Section</button></div>`;
                    secDiv.appendChild(content);
                }
                app.appendChild(secDiv);
            });

            const pct = globalTotal===0?0:Math.round((globalDone/globalTotal)*100);
            document.getElementById('global-progress').style.width = `${pct}%`;
           const ranks = [
                "👶 Hello World",       // 0-9%
                "💻 Script Kiddie",     // 10-19%
                "🐛 Bug Hunter",        // 20-29%
                "🛠️ Apprentice",        // 30-39%
                "💠 Junior Dev",        // 40-49%
                "🚀 Developer",         // 50-59%
                "🔥 Senior Dev",        // 60-69%
                "🏛️ System Architect",  // 70-79%
                "🌌 Lead Engineer",     // 80-89%
                "👑 God Mode"           // 90-100%
            ];
            document.getElementById('rank-badge').innerText = ranks[Math.floor((pct/10))] || "👶 Hello World";
            renderHeatmap(heatmapCounts);
        }

        // --- ACTIONS ---
        const addSection = () => { const t=prompt("Section:"); if(t){ saveState(); data.push({id:Date.now(), title:t, startDate:"", collapsed:false, subsections:[]}); save(); }};
        const editSection = (i) => { const t=prompt("Rename:", data[i].title); if(t){ saveState(); data[i].title=t; save(); }};
        const deleteSection = (i) => { if(confirm("Delete?")){ saveState(); data.splice(i,1); save(); }};
        const updateSectionDate = (i,v) => { data[i].startDate=v; save(); };
        const toggleCollapse = (i) => { data[i].collapsed=!data[i].collapsed; save(); };
        const addSub = (i) => { const t=prompt("Sub-Section:"); if(t){ saveState(); data[i].subsections.push({id:Date.now(), title:t, tasks:[]}); save(); }};
        const editSub = (i,j) => { const t=prompt("Rename:", data[i].subsections[j].title); if(t){ saveState(); data[i].subsections[j].title=t; save(); }};
        const deleteSub = (i,j) => { if(confirm("Delete?")){ saveState(); data[i].subsections.splice(j,1); save(); }};
        const addTask = (i,j) => { const t=prompt("Task:"); if(t){ saveState(); data[i].subsections[j].tasks.push({id:Date.now(), text:t, completed:false, notes:"", subtasks:[]}); save(); }};
        const editTask = (i,j,k) => { const t=prompt("Rename:", data[i].subsections[j].tasks[k].text); if(t){ saveState(); data[i].subsections[j].tasks[k].text=t; save(); }};
        const deleteTask = (i,j,k) => { if(confirm("Delete?")){ saveState(); data[i].subsections[j].tasks.splice(k,1); save(); }};
        const toggleTask = (i,j,k) => { saveState(); const t=data[i].subsections[j].tasks[k]; t.completed=!t.completed; t.completedDate=t.completed?new Date().toISOString():null; if(t.completed)fireConfetti(); save(); };
        const addSubTask = (i,j,k) => { const t=prompt("Sub-Task:"); if(t){ saveState(); if(!data[i].subsections[j].tasks[k].subtasks) data[i].subsections[j].tasks[k].subtasks=[]; data[i].subsections[j].tasks[k].subtasks.push({id:Date.now(), text:t, completed:false}); save(); }};
        const editSubTask = (i,j,k,l) => { const t=prompt("Rename:", data[i].subsections[j].tasks[k].subtasks[l].text); if(t){ saveState(); data[i].subsections[j].tasks[k].subtasks[l].text=t; save(); }};
        const deleteSubTask = (i,j,k,l) => { saveState(); data[i].subsections[j].tasks[k].subtasks.splice(l,1); save(); };
        const toggleSubTask = (i,j,k,l) => { saveState(); const st=data[i].subsections[j].tasks[k].subtasks[l]; st.completed=!st.completed; st.completedDate=st.completed?new Date().toISOString():null; if(st.completed)fireConfetti(); save(); };
        const toggleNote = (i,j,k) => { const n=document.getElementById(`note-${i}-${j}-${k}`); n.style.display=n.style.display==='block'?'none':'block'; };
        const saveNote = (i,j,k,v) => { data[i].subsections[j].tasks[k].notes=v; localStorage.setItem('dt_v11_data', JSON.stringify(data)); };

        // --- DAILY LOGIC FIX ---
        function initDaily() {
            // Set default date to Today IF it's empty
            if (!daily.date) {
                // YYYY-MM-DD format for input
                const now = new Date();
                daily.date = now.toISOString().split('T')[0]; 
            }
            
            // Check Streak
            const todayStr = new Date().toDateString();
            const yest = new Date(); yest.setDate(yest.getDate()-1);
            if (daily.lastVisit === yest.toDateString()) daily.streak++;
            else if (daily.lastVisit !== todayStr && daily.lastVisit !== "") daily.streak = 1; // Reset if skipped, but ignore fresh start
            else if (daily.streak === 0) daily.streak = 1; // First visit ever

            daily.lastVisit = todayStr;
            
            // Update DOM
            document.getElementById('daily-goal').value = daily.goal;
            document.getElementById('daily-date').value = daily.date; // Set input to stored date
            document.getElementById('streak-display').innerText = `🔥 ${daily.streak} Day Streak`;
            document.getElementById('quote-display').innerText = `"${quotes[Math.floor(Math.random()*quotes.length)]}"`;
            
            localStorage.setItem('dt_v11_daily', JSON.stringify(daily));
        }

        function saveDaily() { 
            daily.goal = document.getElementById('daily-goal').value; 
            localStorage.setItem('dt_v11_daily', JSON.stringify(daily)); 
        }

        function updateDailyDate(val) {
            daily.date = val;
            localStorage.setItem('dt_v11_daily', JSON.stringify(daily));
        }

        // --- TIMER & UTILS ---
        function renderHeatmap(counts) {
            const el=document.getElementById('heatmap'); el.innerHTML=''; const today=new Date();
            for(let i=29; i>=0; i--) {
                const d=new Date(); d.setDate(today.getDate()-i); const ds=d.toDateString(); const c=counts[ds]||0;
                const cell=document.createElement('div'); cell.className='heat-cell'; cell.style.background=`var(--heat-${Math.min(c,4)})`; cell.setAttribute('data-tooltip', `${ds}: ${c} items`); el.appendChild(cell);
            }
        }
        let timerInt, timeLeft=1500, isRun=false;
        const updateTimer=()=>{const m=Math.floor(timeLeft/60).toString().padStart(2,'0'), s=(timeLeft%60).toString().padStart(2,'0'); document.getElementById('timer-display').innerText=`${m}:${s}`; document.title=isRun?`(${m}:${s})`:"DevTrack";};
        const startTimer=()=>{if(isRun)return;isRun=true;timerInt=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){pauseTimer();alert("Time's Up!");timeLeft=1500;updateTimer();}},1000);};
        const pauseTimer=()=>{clearInterval(timerInt);isRun=false;updateTimer();};
        const resetTimer=()=>{pauseTimer();timeLeft=1500;updateTimer();};
        function fireConfetti(){
            const ctx=document.getElementById('confetti-canvas').getContext('2d'); let w=window.innerWidth,h=window.innerHeight,p=[];
            document.getElementById('confetti-canvas').width=w;document.getElementById('confetti-canvas').height=h;
            for(let i=0;i<40;i++)p.push({x:Math.random()*w,y:Math.random()*h-h,c:`hsl(${Math.random()*360},100%,50%)`,s:Math.random()*6+2,v:Math.random()*5+2});
            let o=1;function l(){ctx.clearRect(0,0,w,h);o-=0.02;p.forEach(a=>{a.y+=a.v;ctx.fillStyle=a.c;ctx.globalAlpha=o;ctx.fillRect(a.x,a.y,a.s,a.s)});if(o>0)requestAnimationFrame(l);else ctx.clearRect(0,0,w,h);}l();
        }
        const resetAll=()=>{if(confirm("Reset everything?")){localStorage.clear();location.reload();}};
        const exportData=()=>{const a=document.createElement("a");a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(data));a.download="devtrack_backup.json";a.click();};
        const importData=(el)=>{const r=new FileReader();r.onload=e=>{saveState();data=JSON.parse(e.target.result);save();alert("Imported!");};r.readAsText(el.files[0]);};
        const toggleTheme=()=>{darkMode=!darkMode;document.documentElement.setAttribute('data-theme',darkMode?'dark':'light');localStorage.setItem('dt_v11_theme',darkMode?'dark':'light');};
        if(darkMode)toggleTheme();

        initDaily(); render();
    </script>
</body>
