<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevTrack UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Modern Palette */
            --bg: #f0f2f5;
            --surface: #ffffff;
            --surface-glass: rgba(255, 255, 255, 0.85);
            --text: #111827;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --primary: #6366f1; /* Indigo */
            --primary-glow: rgba(99, 102, 241, 0.3);
            --accent: #f59e0b;
            --success: #10b981;
            --danger: #ef4444;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            
            /* Heatmap Colors */
            --heat-0: #e5e7eb;
            --heat-1: #c7d2fe;
            --heat-2: #818cf8;
            --heat-3: #6366f1;
            --heat-4: #312e81;
        }

        [data-theme="dark"] {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-glass: rgba(30, 41, 59, 0.85);
            --text: #f1f5f9;
            --text-sub: #94a3b8;
            --border: #334155;
            --primary: #818cf8;
            --primary-glow: rgba(129, 140, 248, 0.3);
            --accent: #fbbf24;
            --heat-0: #1e293b;
            --heat-1: #1e3a8a;
            --heat-2: #3730a3;
            --heat-3: #6366f1;
            --heat-4: #818cf8;
        }

        * { box-sizing: border-box; outline: none; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding-top: 100px;
            padding-bottom: 50px;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* --- SCROLLBAR --- */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--text-sub); border-radius: 4px; opacity: 0.5; }

        /* --- HEADER (Glassmorphism) --- */
        .header-container {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--surface-glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            z-index: 1000;
            padding: 15px 20px;
            transition: all 0.3s ease;
        }

        .header-inner { max-width: 1000px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        
        h1 { 
            margin: 0; font-weight: 900; font-size: 1.5rem; letter-spacing: -0.5px; 
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex; align-items: center; gap: 10px;
        }

        .rank-badge {
            font-size: 0.75rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
            background: var(--bg); color: var(--text); padding: 4px 10px; border-radius: 20px;
            border: 1px solid var(--border); -webkit-text-fill-color: var(--text);
        }

        /* --- BUTTONS --- */
        .btn {
            border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer;
            font-weight: 600; font-size: 0.9rem; transition: all 0.2s ease;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
        }
        .btn:active { transform: scale(0.96); }
        
        .btn-primary { 
            background: var(--primary); color: white; 
            box-shadow: 0 4px 12px var(--primary-glow);
        }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px var(--primary-glow); }
        
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { background: var(--bg); border-color: var(--text-sub); }
        
        .btn-ghost { background: transparent; color: var(--text-sub); padding: 4px; }
        .btn-ghost:hover { color: var(--text); background: var(--bg); border-radius: 4px; }

        /* --- PROGRESS BAR --- */
        .progress-track {
            width: 100%; height: 6px; background: var(--border); border-radius: 10px;
            overflow: hidden; max-width: 1000px; margin: 0 auto;
        }
        .progress-fill {
            height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%; transition: width 0.8s cubic-bezier(0.22, 1, 0.36, 1);
        }

        /* --- DASHBOARD LAYOUT --- */
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        
        .dashboard-grid {
            display: grid; grid-template-columns: 2fr 1fr; gap: 25px;
            margin-bottom: 40px; margin-top: 20px;
        }

        .card {
            background: var(--surface); border-radius: 16px; padding: 25px;
            box-shadow: var(--shadow-md); border: 1px solid var(--border);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }

        .card-title {
            font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-sub); margin-bottom: 15px; display: flex; justify-content: space-between;
        }

        .focus-input {
            width: 100%; padding: 15px; font-size: 1.1rem; border: 2px solid var(--border);
            border-radius: 12px; background: var(--bg); color: var(--text);
            transition: border-color 0.3s;
        }
        .focus-input:focus { border-color: var(--primary); }

        /* --- HEATMAP --- */
        .heatmap-grid { display: flex; gap: 4px; margin-top: 20px; height: 30px; align-items: flex-end; }
        .heat-cell { 
            flex: 1; border-radius: 4px; background: var(--heat-0); 
            transition: height 0.3s, background-color 0.3s; height: 100%; position: relative;
        }
        .heat-cell:hover { transform: scale(1.2); z-index: 2; cursor: pointer; }
        .heat-cell:hover::after {
            content: attr(data-tooltip); position: absolute; bottom: 35px; left: 50%; transform: translateX(-50%);
            background: var(--text); color: var(--bg); padding: 6px 10px; font-size: 0.75rem; 
            border-radius: 6px; white-space: nowrap; font-weight: 600;
        }

        /* --- TIMER --- */
        .timer-display { font-size: 3rem; font-weight: 900; text-align: center; color: var(--text); margin: 10px 0; letter-spacing: -2px; }
        .timer-actions { display: flex; justify-content: center; gap: 10px; }

        /* --- TOPIC LIST --- */
        .topic-card {
            background: var(--surface); border-radius: 16px; margin-bottom: 20px;
            box-shadow: var(--shadow-sm); border: 1px solid var(--border); overflow: hidden;
            animation: slideUp 0.5s ease forwards; opacity: 0;
        }

        .topic-header {
            padding: 20px; background: linear-gradient(to right, var(--surface), var(--bg));
            display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; user-select: none;
        }
        .topic-header:hover { background: var(--bg); }
        .topic-title { font-size: 1.2rem; font-weight: 700; color: var(--text); }

        .topic-content { display: none; padding-bottom: 10px; }
        .topic-content.open { display: block; animation: fadeIn 0.3s ease; }

        /* --- TASKS --- */
        .subtopic-wrapper { padding: 0 20px; margin-bottom: 10px; }
        .subtopic-title {
            font-size: 0.9rem; font-weight: 800; color: var(--primary);
            margin: 15px 0 10px 0; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; justify-content: space-between;
        }

        .task-item {
            display: flex; align-items: flex-start; padding: 12px; margin-bottom: 8px;
            background: var(--bg); border-radius: 10px; border: 1px solid transparent;
            transition: all 0.2s; gap: 12px;
        }
        .task-item:hover { border-color: var(--primary); background: var(--surface); box-shadow: var(--shadow-sm); }
        .task-item.completed { opacity: 0.6; background: transparent; }
        
        /* Custom Checkbox */
        .checkbox-wrapper {
            min-width: 22px; height: 22px; border: 2px solid var(--border); border-radius: 6px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: all 0.2s; background: var(--surface); margin-top: 2px;
        }
        .checkbox-wrapper.checked { background: var(--success); border-color: var(--success); }
        .checkbox-wrapper svg { width: 14px; height: 14px; color: white; display: none; }
        .checkbox-wrapper.checked svg { display: block; }

        .task-text { flex: 1; font-size: 0.95rem; line-height: 1.5; }
        .task-text a { color: var(--primary); text-decoration: none; font-weight: 500; border-bottom: 1px dashed var(--primary); }
        .completed .task-text { text-decoration: line-through; color: var(--text-sub); }

        /* Notes */
        .notes-area {
            width: 100%; background: var(--text); color: var(--bg); border-radius: 8px;
            padding: 10px; margin-top: 10px; font-family: monospace; font-size: 0.9rem;
            border: none; display: none;
        }
        .notes-area.active { display: block; }

        /* --- TOAST NOTIFICATION --- */
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; }
        .toast {
            background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 8px;
            margin-top: 10px; box-shadow: var(--shadow-lg); font-weight: 600; font-size: 0.9rem;
            animation: slideInRight 0.3s ease forwards; display: flex; align-items: center; gap: 10px;
        }

        /* --- ANIMATIONS --- */
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideInRight { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        @media (max-width: 768px) { .dashboard-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <canvas id="confetti-canvas" style="position:fixed; top:0; left:0; pointer-events:none; z-index:9999;"></canvas>

    <div id="toast-container"></div>

    <div class="header-container">
        <div class="header-inner">
            <h1>DevTrack <span class="rank-badge" id="rank-badge">Novice</span></h1>
            <div style="display: flex; gap: 8px;">
                <button class="btn btn-outline" onclick="toggleTheme()" id="theme-btn">🌙</button>
                <button class="btn btn-outline" onclick="exportData()">💾 Export</button>
                <label class="btn btn-outline" style="cursor:pointer">
                    📂 Import <input type="file" style="display:none" onchange="importData(this)">
                </label>
            </div>
        </div>
        <div class="progress-track">
            <div class="progress-fill" id="global-progress"></div>
        </div>
    </div>

    <div class="container">
        <div class="dashboard-grid">
            <div class="card">
                <div class="card-title">
                    <span>🎯 Today's Mission</span>
                    <span id="streak-display" style="color:var(--accent)">🔥 0 Days</span>
                </div>
                <input type="text" id="daily-goal" class="focus-input" placeholder="What is your main focus today?" oninput="saveDaily()">
                
                <div class="heatmap-grid" id="heatmap"></div>
            </div>

            <div class="card" style="text-align: center; display: flex; flex-direction: column; justify-content: center;">
                <div class="card-title" style="justify-content: center;">POMODORO FOCUS</div>
                <div class="timer-display" id="timer-display">25:00</div>
                <div class="timer-actions">
                    <button class="btn btn-primary" onclick="startTimer()">▶ Start</button>
                    <button class="btn btn-outline" onclick="pauseTimer()">⏸</button>
                    <button class="btn btn-outline" onclick="resetTimer()">↺</button>
                </div>
            </div>
        </div>
    </div>

    <div class="container" id="app"></div>

    <div class="container" style="text-align: center; margin: 50px 0;">
        <button class="btn btn-primary" style="padding: 12px 24px;" onclick="addTopic()">+ Add New Topic</button>
        <p style="margin-top: 20px; opacity: 0.5; font-size: 0.8rem; cursor: pointer;" onclick="resetData()">⚠️ Reset Data</p>
    </div>

    <script>
        // --- STATE ---
        const initialData = [
            { title: "Responsive Web Design", collapsed: false, subtopics: [{ title: "Certification", tasks: [{ text: "Complete Course: https://www.freecodecamp.org/learn/responsive-web-design-v9/", completed: false }]}] },
            { title: "JavaScript Algorithms", collapsed: false, subtopics: [{ title: "Basic JS", tasks: [{ text: "MathBot Project: https://www.freecodecamp.org/learn/javascript-v9/#workshop-mathbot", completed: false }]}] }
        ];
        
        let data = JSON.parse(localStorage.getItem('devTrackData')) || initialData;
        let daily = JSON.parse(localStorage.getItem('devTrackDaily')) || { goal: "", date: "", streak: 0, lastVisit: "" };
        let darkMode = localStorage.getItem('devTrackTheme') === 'dark';

        // --- UTILS ---
        const save = () => { localStorage.setItem('devTrackData', JSON.stringify(data)); render(); };
        const showToast = (msg) => {
            const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `✅ ${msg}`;
            document.getElementById('toast-container').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        };
        const linkify = (text) => text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">Resource Link</a>');

        // --- THEME ---
        const setTheme = (isDark) => {
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-btn').innerText = isDark ? '☀️' : '🌙';
            localStorage.setItem('devTrackTheme', isDark ? 'dark' : 'light');
        }
        setTheme(darkMode);
        function toggleTheme() { darkMode = !darkMode; setTheme(darkMode); }

        // --- RENDER APP ---
        function render() {
            const app = document.getElementById('app'); app.innerHTML = '';
            let total = 0, done = 0;

            data.forEach((topic, tIdx) => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.style.animationDelay = `${tIdx * 0.1}s`;

                // Header
                const header = document.createElement('div');
                header.className = 'topic-header';
                header.innerHTML = `<div style="display:flex; align-items:center; gap:10px;">
                                        <span style="font-size:0.8rem; opacity:0.5;">${topic.collapsed ? '▶' : '▼'}</span>
                                        <span class="topic-title">${topic.title}</span>
                                    </div>
                                    <div>
                                        <button class="btn-ghost" onclick="event.stopPropagation(); renameTopic(${tIdx})">✏️</button>
                                        <button class="btn-ghost" style="color:var(--danger)" onclick="event.stopPropagation(); deleteTopic(${tIdx})">🗑️</button>
                                    </div>`;
                header.onclick = () => { topic.collapsed = !topic.collapsed; save(); };
                card.appendChild(header);

                // Content
                const content = document.createElement('div');
                content.className = `topic-content ${topic.collapsed ? '' : 'open'}`;
                
                topic.subtopics.forEach((sub, sIdx) => {
                    const subDiv = document.createElement('div');
                    subDiv.className = 'subtopic-wrapper';
                    subDiv.innerHTML = `<div class="subtopic-title">
                                            ${sub.title} 
                                            <button class="btn-ghost" style="font-size:0.7rem" onclick="addTask(${tIdx}, ${sIdx})">+ TASK</button>
                                        </div>`;
                    
                    sub.tasks.forEach((task, kIdx) => {
                        total++; if(task.completed) done++;
                        const isChecked = task.completed ? 'checked' : '';
                        const isDone = task.completed ? 'completed' : '';
                        
                        const taskEl = document.createElement('div');
                        taskEl.className = `task-item ${isDone}`;
                        taskEl.innerHTML = `
                            <div class="checkbox-wrapper ${isChecked}" onclick="toggleTask(${tIdx}, ${sIdx}, ${kIdx})">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"></polyline></svg>
                            </div>
                            <div style="flex:1">
                                <div class="task-text">${linkify(task.text)}</div>
                                <div style="margin-top:5px; display:flex; gap:10px;">
                                    <button class="btn-ghost" style="font-size:0.75rem;" onclick="toggleNote(${tIdx}, ${sIdx}, ${kIdx})">📝 Notes</button>
                                    <button class="btn-ghost" style="font-size:0.75rem;" onclick="editTask(${tIdx}, ${sIdx}, ${kIdx})">✏️ Edit</button>
                                    <button class="btn-ghost" style="font-size:0.75rem; color:var(--danger)" onclick="deleteTask(${tIdx}, ${sIdx}, ${kIdx})">🗑️</button>
                                </div>
                                <textarea class="notes-area ${task.showNotes ? 'active' : ''}" placeholder="Type notes here..." oninput="updateNote(this, ${tIdx}, ${sIdx}, ${kIdx})">${task.notes || ''}</textarea>
                            </div>
                        `;
                        subDiv.appendChild(taskEl);
                    });
                    content.appendChild(subDiv);
                });
                
                // Add Subtopic Btn
                const addSubDiv = document.createElement('div');
                addSubDiv.style.padding = "10px 20px";
                addSubDiv.innerHTML = `<button class="btn btn-outline" style="width:100%; font-size:0.8rem" onclick="addSub(${tIdx})">+ New Sub-Section</button>`;
                content.appendChild(addSubDiv);

                card.appendChild(content);
                app.appendChild(card);
            });

            // Global Stats
            const pct = total === 0 ? 0 : Math.round((done/total)*100);
            document.getElementById('global-progress').style.width = `${pct}%`;
            updateRank(pct);
            renderHeatmap();
        }

        // --- HEATMAP ---
        function renderHeatmap() {
            const el = document.getElementById('heatmap'); el.innerHTML = '';
            const today = new Date();
            const counts = {};
            
            data.forEach(t => t.subtopics.forEach(s => s.tasks.forEach(k => {
                if(k.completed && k.completedDate) {
                    const d = new Date(k.completedDate).toDateString();
                    counts[d] = (counts[d] || 0) + 1;
                }
            })));

            for(let i=29; i>=0; i--) {
                const d = new Date(); d.setDate(today.getDate()-i);
                const dateStr = d.toDateString();
                const c = counts[dateStr] || 0;
                const cell = document.createElement('div');
                cell.className = 'heat-cell';
                cell.style.background = `var(--heat-${Math.min(c, 4)})`;
                cell.setAttribute('data-tooltip', `${dateStr}: ${c} tasks`);
                el.appendChild(cell);
            }
        }

        function updateRank(pct) {
            const ranks = ["Novice", "Apprentice", "Developer", "Engineer", "Tech Lead"];
            const r = ranks[Math.floor((pct/101)*5)] || "Novice";
            document.getElementById('rank-badge').innerText = r;
        }

        // --- TIMER ---
        let timerInt, timeLeft=1500, isRun=false;
        function updateTimer() {
            const m = Math.floor(timeLeft/60).toString().padStart(2,'0');
            const s = (timeLeft%60).toString().padStart(2,'0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
            document.title = isRun ? `(${m}:${s}) DevTrack` : "DevTrack";
        }
        function startTimer() { if(isRun)return; isRun=true; timerInt=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){pauseTimer();showToast("Time's up!");timeLeft=1500;updateTimer();}},1000); }
        function pauseTimer() { clearInterval(timerInt); isRun=false; }
        function resetTimer() { pauseTimer(); timeLeft=1500; updateTimer(); }

        // --- ACTIONS ---
        const addTopic = () => { const t=prompt("Topic Name:"); if(t){data.push({title:t, collapsed:false, subtopics:[]});save();showToast("Topic Added");} };
        const renameTopic = (i) => { const t=prompt("Rename:", data[i].title); if(t){data[i].title=t;save();} };
        const deleteTopic = (i) => { if(confirm("Delete topic?")){data.splice(i,1);save();showToast("Topic Deleted");} };
        const addSub = (i) => { const t=prompt("Sub-section Name:"); if(t){data[i].subtopics.push({title:t, tasks:[]});save();} };
        const addTask = (i,j) => { const t=prompt("New Task:"); if(t){data[i].subtopics[j].tasks.push({text:t, completed:false});save();showToast("Task Added");} };
        const toggleTask = (i,j,k) => { 
            const t = data[i].subtopics[j].tasks[k]; t.completed=!t.completed; 
            t.completedDate = t.completed ? new Date().toISOString() : null;
            if(t.completed) { fireConfetti(); showToast("Task Completed!"); }
            save(); 
        };
        const editTask = (i,j,k) => { const t=prompt("Edit:", data[i].subtopics[j].tasks[k].text); if(t){data[i].subtopics[j].tasks[k].text=t;save();} };
        const deleteTask = (i,j,k) => { if(confirm("Delete?")){data[i].subtopics[j].tasks.splice(k,1);save();} };
        const toggleNote = (i,j,k) => { data[i].subtopics[j].tasks[k].showNotes = !data[i].subtopics[j].tasks[k].showNotes; save(); };
        const updateNote = (el,i,j,k) => { data[i].subtopics[j].tasks[k].notes = el.value; localStorage.setItem('devTrackData', JSON.stringify(data)); };
        const resetData = () => { if(confirm("Reset All?")){localStorage.clear();location.reload();} };
        
        // --- DAILY ---
        function initDaily() {
            const t = new Date().toDateString();
            if(daily.date !== t) {
                const y = new Date(); y.setDate(y.getDate()-1);
                if(daily.lastVisit===y.toDateString()) daily.streak++; else if(daily.lastVisit!==t) daily.streak=1;
                daily.date=t; daily.lastVisit=t; daily.goal=""; localStorage.setItem('devTrackDaily', JSON.stringify(daily));
            }
            document.getElementById('daily-goal').value = daily.goal;
            document.getElementById('streak-display').innerText = `🔥 ${daily.streak} Day Streak`;
        }
        function saveDaily() { daily.goal=document.getElementById('daily-goal').value; localStorage.setItem('devTrackDaily', JSON.stringify(daily)); }

        // --- CONFETTI ---
        function fireConfetti() {
            const ctx = document.getElementById('confetti-canvas').getContext('2d');
            let w=window.innerWidth, h=window.innerHeight, p=[];
            document.getElementById('confetti-canvas').width=w; document.getElementById('confetti-canvas').height=h;
            for(let i=0; i<40; i++) p.push({x:Math.random()*w, y:Math.random()*h-h, c:`hsl(${Math.random()*360},100%,50%)`, s:Math.random()*6+2, v:Math.random()*5+2});
            let o=1; function l(){ ctx.clearRect(0,0,w,h); o-=0.02; p.forEach(a=>{a.y+=a.v;ctx.fillStyle=a.c;ctx.globalAlpha=o;ctx.fillRect(a.x,a.y,a.s,a.s)}); if(o>0)requestAnimationFrame(l); else ctx.clearRect(0,0,w,h); } l();
        }
        
        // Export/Import
        const exportData = () => { const a=document.createElement("a"); a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(data)); a.download="devtrack.json"; a.click(); };
        const importData = (el) => { const r=new FileReader(); r.onload=e=>{data=JSON.parse(e.target.result);save();showToast("Data Imported");}; r.readAsText(el.files[0]); };

        initDaily(); render();
    </script>
</body>
</html>
